<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>tone-field-visualization — spectrum demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #eee;
        margin: 0;
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.1rem;
        font-weight: 600;
      }
      p {
        color: #aaa;
        max-width: 60ch;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 1.5rem;
        margin-top: 1.5rem;
      }
      figure {
        margin: 0;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 0.75rem;
        resize: both;
        overflow: hidden;
        min-width: 260px;
        min-height: 160px;
      }
      figcaption {
        font-size: 0.85rem;
        color: #ccc;
        margin-bottom: 0.5rem;
      }
      canvas {
        width: 100%;
        height: 180px;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>tone-field-visualization — spectrum/equalizer demo</h1>
    <p>
      Hardcoded synthetic <code>SpectrumMagnitudes</code> fed through
      <code>barsFromSpectrum</code> into <code>SpectrumViewRenderer</code>. Each panel is
      CSS-resizable (drag the bottom-right corner) to manually verify devicePixelRatio rescaling
      on resize.
    </p>
    <div class="grid" id="grid"></div>
    <script type="module" src="./demo.ts"></script>
  </body>
</html>
